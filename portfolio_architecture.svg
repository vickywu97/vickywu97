<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">作品集架构 · Portfolio Architecture</text>

  <!-- Tier labels -->
  <text x="16" y="70" font-size="12" font-weight="700" fill="#57606a">地基</text>
  <text x="16" y="86" font-size="11" fill="#57606a">Foundation</text>
  <text x="16" y="178" font-size="12" font-weight="700" fill="#57606a">量化·产品</text>
  <text x="16" y="194" font-size="11" fill="#57606a">Quant·Product</text>
  <text x="16" y="272" font-size="12" font-weight="700" fill="#57606a">公开·工具</text>
  <text x="16" y="288" font-size="11" fill="#57606a">Public·Tools</text>

  <!-- Tier 1: Foundation (3 nodes) -->
  <g>
    <rect x="70" y="48" width="186" height="74" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="84" y="74" font-size="13" font-weight="700" fill="#1f2328">🧱 verified-chinese-law-kb</text>
    <text x="84" y="96" font-size="11" fill="#57606a">数据地基 · 2,327 条逐字核验 / 8 法</text>
    <text x="84" y="112" font-size="11" fill="#57606a">Data foundation · 27 signed + AI-verified</text>

    <rect x="267" y="48" width="186" height="74" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="281" y="74" font-size="13" font-weight="700" fill="#1f2328">🔬 law-citation-bench</text>
    <text x="281" y="96" font-size="11" fill="#57606a">评测地基 · 500 题 / 一行提示 +97pt</text>
    <text x="281" y="112" font-size="11" fill="#57606a">Eval foundation · offline stdlib</text>

    <rect x="464" y="48" width="186" height="74" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="478" y="74" font-size="13" font-weight="700" fill="#1f2328">🗂️ law-cli</text>
    <text x="478" y="96" font-size="11" fill="#57606a">法条数据 CLI · fetch/show/verify</text>
    <text x="478" y="112" font-size="11" fill="#57606a">Statute CLI · 零依赖 · AI 终核</text>
  </g>

  <!-- arrows tier1 -> tier2 -->
  <path d="M157 122 L157 144" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M554 122 L554 144" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Tier 2: Quant / Product -->
  <g>
    <rect x="70" y="146" width="290" height="74" rx="8" fill="#fff8f0" stroke="#d0d7de"/>
    <text x="84" y="172" font-size="13" font-weight="700" fill="#1f2328">📉 legal-hallucination-bench</text>
    <text x="84" y="194" font-size="11" fill="#57606a">量化 · HVI 33.3%–54.2% · 212 Tier A 签核 · 私有</text>
    <text x="84" y="210" font-size="11" fill="#57606a">Quantification · 5 模型 × 23 陷阱题</text>

    <rect x="380" y="146" width="300" height="74" rx="8" fill="#f0f8ff" stroke="#d0d7de"/>
    <text x="394" y="172" font-size="13" font-weight="700" fill="#1f2328">🛡️ compliance-triangle</text>
    <text x="394" y="194" font-size="11" fill="#57606a">产品 · 🟢🟡🔴 三域合规章</text>
    <text x="394" y="210" font-size="11" fill="#57606a">Product · verify engine, legal·tax·IP</text>
  </g>

  <!-- arrow tier2 -> tier3 -->
  <path d="M430 220 L430 242" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Tier 3: Public · Tools -->
  <g>
    <rect x="70" y="244" width="290" height="74" rx="8" fill="#f3fcf3" stroke="#d0d7de"/>
    <text x="84" y="270" font-size="13" font-weight="700" fill="#1f2328">📡 legal-ai-watch</text>
    <text x="84" y="292" font-size="11" fill="#57606a">公开榜单 · 31 题评测 + gh-pages 仪表盘</text>
    <text x="84" y="308" font-size="11" fill="#57606a">Public leaderboard · 31-Q eval + dashboard</text>

    <rect x="380" y="244" width="300" height="74" rx="8" fill="#fdf6ff" stroke="#d0d7de"/>
    <text x="394" y="270" font-size="13" font-weight="700" fill="#1f2328">⏱️ lawyer-timesheet</text>
    <text x="394" y="292" font-size="11" fill="#57606a">实务工具 · 计时/计费 CLI · 审计哈希链</text>
    <text x="394" y="308" font-size="11" fill="#57606a">Practice tooling · 零依赖 · 智能归类</text>
  </g>

  <!-- Moat footer -->
  <g>
    <rect x="70" y="332" width="610" height="44" rx="8" fill="#eef0f3" stroke="#d0d7de"/>
    <text x="375" y="353" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">🛡️ 护城河 · 三证合一 Moat</text>
    <text x="375" y="369" text-anchor="middle" font-size="11" fill="#57606a">律师 + 税务师 + 专利代理师 — 同一人设计规则·定义陷阱·具名核验每条 Tier A（212 条）</text>
  </g>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8c959f"/>
    </marker>
  </defs>
</svg>
