<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">作品集架构 · Portfolio Architecture</text>

  <!-- Tier labels -->
  <text x="16" y="78" font-size="12" font-weight="700" fill="#57606a">地基</text>
  <text x="16" y="94" font-size="11" fill="#57606a">Foundation</text>
  <text x="16" y="210" font-size="12" font-weight="700" fill="#57606a">量化·产品</text>
  <text x="16" y="226" font-size="11" fill="#57606a">Quant·Product</text>
  <text x="16" y="338" font-size="12" font-weight="700" fill="#57606a">公开</text>
  <text x="16" y="354" font-size="11" fill="#57606a">Public</text>

  <!-- Tier 1: Foundation -->
  <g>
    <rect x="70" y="56" width="290" height="78" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="84" y="82" font-size="13" font-weight="700" fill="#1f2328">🧱 verified-chinese-law-kb</text>
    <text x="84" y="104" font-size="11" fill="#57606a">数据地基 · 2,327 条官方全文 / 8 法</text>
    <text x="84" y="120" font-size="11" fill="#57606a">Data foundation · 212 attorney-signed (Tier A)</text>

    <rect x="380" y="56" width="300" height="78" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="394" y="82" font-size="13" font-weight="700" fill="#1f2328">🔬 law-citation-bench</text>
    <text x="394" y="104" font-size="11" fill="#57606a">评测地基 · 500 题 / 一行提示 +97pt</text>
    <text x="394" y="120" font-size="11" fill="#57606a">Eval foundation · offline stdlib benchmark</text>
  </g>

  <!-- arrows tier1 -> tier2 -->
  <path d="M215 134 L215 168" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M530 134 L530 168" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Tier 2: Quant / Product -->
  <g>
    <rect x="70" y="172" width="290" height="78" rx="8" fill="#fff8f0" stroke="#d0d7de"/>
    <text x="84" y="198" font-size="13" font-weight="700" fill="#1f2328">📉 legal-hallucination-bench</text>
    <text x="84" y="220" font-size="11" fill="#57606a">量化 · HVI 33.3%–54.2% · 私有</text>
    <text x="84" y="236" font-size="11" fill="#57606a">Quantification · 5 模型 × 23 陷阱题</text>

    <rect x="380" y="172" width="300" height="78" rx="8" fill="#f0f8ff" stroke="#d0d7de"/>
    <text x="394" y="198" font-size="13" font-weight="700" fill="#1f2328">🛡️ compliance-triangle</text>
    <text x="394" y="220" font-size="11" fill="#57606a">产品 · 🟢🟡🔴 三域合规章</text>
    <text x="394" y="236" font-size="11" fill="#57606a">Product · verify engine, legal·tax·IP</text>
  </g>

  <!-- arrow tier2 -> tier3 -->
  <path d="M430 250 L430 288" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Tier 3: Public -->
  <g>
    <rect x="70" y="292" width="610" height="64" rx="8" fill="#f3fcf3" stroke="#d0d7de"/>
    <text x="84" y="318" font-size="13" font-weight="700" fill="#1f2328">📡 legal-ai-watch</text>
    <text x="84" y="338" font-size="11" fill="#57606a">公开榜单 · 31 题评测 + gh-pages 仪表盘，跟踪主流模型法条引用表现</text>
    <text x="84" y="352" font-size="11" fill="#57606a">Public leaderboard · 31-Q eval + live dashboard</text>
  </g>

  <!-- Moat footer -->
  <g>
    <rect x="70" y="376" width="610" height="46" rx="8" fill="#eef0f3" stroke="#d0d7de"/>
    <text x="375" y="398" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">🛡️ 护城河 · 三证合一 Moat</text>
    <text x="375" y="414" text-anchor="middle" font-size="11" fill="#57606a">律师 + 税务师 + 专利代理师 — 同一人设计规则·定义陷阱·具名核验 Tier A</text>
  </g>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8c959f"/>
    </marker>
  </defs>
</svg>
